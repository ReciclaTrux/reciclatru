openapi: 3.0.3
info:
  title: ReciclaTru API
  version: 1.0.0
  description: |
    API de ReciclaTru (Release 1), alineada al Informe de Proyecto Final (UPN 2026-2) y a la nomenclatura BIAN.
    Conecta vecinos con material reciclable y recicladores en Huanchaco / Trujillo.

    **Decisiones del Release 1 (según el informe)**
    - Un solo rol por cuenta: `NEIGHBOR` (vecino) o `RECYCLER` (reciclador). El rol y el correo no se pueden cambiar (RN02, RN03).
    - Autenticación propia: contraseña con bcrypt y JWT de 30 días (`Authorization: Bearer <token>`). Cerrar sesión borra el token en la app (HU-02).
    - Pedido con 1 a 10 ítems (descripción y peso en kg) y hasta 3 fotos opcionales (RN06, RN07).
    - Varios recicladores pueden aceptar un pedido `PENDING`; el vecino confirma a uno solo (RN09, RN12).
    - El vecino marca el pedido como `COLLECTED` (RN15). Los pedidos no se borran, solo se cancelan (RN16, RN17).
    - Ubicación del vecino marcada en mapa (sin GPS); se copia a cada pedido al publicarse (RN18).
    - Ubicación del reciclador: GPS aproximado enviado como parámetro, **no se guarda** (RN19).
    - Privacidad: la dirección, la referencia y las coordenadas exactas solo las ve el reciclador elegido con el pedido `CONFIRMED` (RN13).
    - Sin notificaciones push, chat, pagos ni precios (RN14). La app consulta con pull-to-refresh.
    - Errores en `application/problem+json` (RFC 7807). Un cambio de estado concurrente responde `409 Conflict`.
    - Fuera del Release 1 (Release 2): recuperar contraseña, verificar teléfono, catálogo de materiales, mapa y filtros del reciclador, avisos, vencimiento automático, tope de aceptaciones, cancelación automática, reabrir pedido y retirar aceptación.

    **Convención BIAN usada**
    - Ruta: `/{service-domain}/{cr-reference-id}/{behavior-qualifier}/{action-term}` en kebab-case; el *action term* va sustantivado (`initiation`, `retrieval`, `update`, `execution`, `termination`).
    - Mapeo HTTP: Initiate → `POST`; Retrieve → `GET`; Update, Execute y Terminate → `PUT`.
    - `cr-reference-id` es la referencia del Control Record (usuario, pedido). Las respuestas incluyen `crReferenceId` y `...InstanceRecord`.
    - Los Service Domains son la correspondencia más cercana del landscape BIAN (bancario); no existe un dominio oficial de reciclaje. Cada operación declara su equivalencia en `x-bian`.
    - `/health` queda fuera de BIAN.

    **Trazabilidad y datos sensibles**
    - Cada respuesta incluye el encabezado `x-correlation-id`. Si la app envía uno (hasta 100 caracteres: letras, números y `._:-`) se conserva; si no, el servidor genera un UUID. Los errores lo repiten en `correlationId`.
    - El celular se guarda **ofuscado** en la base de datos (`987654321` queda como `987****21`) y cifrado aparte. La API devuelve el número real solo al dueño del perfil y a la contraparte autorizada (HU-12, HU-13).
    - Las listas usan paginación por **cursor opaco**: la app envía de vuelta `nextCursor` sin interpretarlo. Un cursor alterado responde `400`.
  contact:
    name: Equipo ReciclaTru
servers:
- url: https://api.reciclatru.example.com/api/v1
  description: Producción
- url: http://localhost:3000/api/v1
  description: Desarrollo local
tags:
- name: Sistema
- name: Party Authentication
- name: Party Data Management
- name: Location Data Management
- name: Servicing Order
security:
- bearerAuth: []
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servicio
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Servicio activo
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: UP
                  version:
                    type: string
                    example: 1.0.0

  # ───────────── Party Data Management: cuenta y perfil (HU-01, HU-03) ─────────────
  /party-data-management/initiation:
    post:
      tags: [Party Data Management]
      summary: Registrarme con un rol
      description: |
        HU-01. Crea la cuenta con correo, contraseña y rol. El correo se guarda en minúsculas y sin espacios,
        con índice único. La contraseña se guarda con bcrypt. Tras registrarse, la app lleva a completar el perfil (HU-03).
      operationId: initiatePartyDataManagement
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyDataManagementInitiateInputModel'
            examples:
              vecino:
                summary: Registro de un vecino
                value:
                  email: rosa.carranza@example.com
                  password: Reciclatru2026
                  role: NEIGHBOR
              reciclador:
                summary: Registro de un reciclador
                value:
                  email: jorge.mendoza@example.com
                  password: Reciclatru2026
                  role: RECYCLER
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyDataManagementOutputModel'
              examples:
                vecino:
                  summary: 'Cuenta recién creada: el perfil aún está incompleto (se completa en HU-03)'
                  value:
                    crReferenceId: 7b1c2d3e-4f50-4a61-8b72-93a4b5c6d7e8
                    partyDataManagementInstanceRecord:
                      id: 7b1c2d3e-4f50-4a61-8b72-93a4b5c6d7e8
                      email: rosa.carranza@example.com
                      role: NEIGHBOR
                      fullName: null
                      phone: null
                      reference: null
                      pickupPoint: null
                      profileComplete: false
                      createdAt: '2026-10-20T13:42:10Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Ya existe una cuenta con ese correo (`EMAIL_ALREADY_REGISTERED`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                duplicado:
                  summary: Correo ya registrado
                  value:
                    type: https://api.reciclatru.example.com/errors/email-already-registered
                    title: Correo ya registrado
                    status: 409
                    code: EMAIL_ALREADY_REGISTERED
                    detail: Ya existe una cuenta con ese correo.
                    instance: /api/v1/party-data-management/initiation
      x-bian:
        serviceDomain: Party Data Management
        actionTerm: Initiate
  /party-data-management/{cr-reference-id}/retrieval:
    parameters:
    - $ref: '#/components/parameters/CrReferenceId'
    get:
      tags: [Party Data Management]
      summary: Obtener mi perfil
      description: Usa `me` como `cr-reference-id` para el usuario autenticado. Incluye si el perfil está completo (RN20).
      operationId: retrievePartyDataManagement
      responses:
        '200':
          description: Perfil del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyDataManagementOutputModel'
              examples:
                vecino_completo:
                  summary: Vecino con perfil y ubicación completos (GET con `me`)
                  value:
                    crReferenceId: 7b1c2d3e-4f50-4a61-8b72-93a4b5c6d7e8
                    partyDataManagementInstanceRecord:
                      id: 7b1c2d3e-4f50-4a61-8b72-93a4b5c6d7e8
                      email: rosa.carranza@example.com
                      role: NEIGHBOR
                      fullName: Rosa Elena Carranza Vega
                      phone: '987654321'
                      reference: Casa de dos pisos con portón verde, frente al parque
                      pickupPoint:
                        latitude: -8.077806
                        longitude: -79.122183
                        address: Av. Víctor Larco 1280, Huanchaco
                        district: Huanchaco
                      profileComplete: true
                      createdAt: '2026-10-20T13:42:10Z'
                reciclador:
                  summary: Reciclador con perfil completo
                  value:
                    crReferenceId: c4d5e6f7-0819-4a2b-9c3d-4e5f60718293
                    partyDataManagementInstanceRecord:
                      id: c4d5e6f7-0819-4a2b-9c3d-4e5f60718293
                      email: jorge.mendoza@example.com
                      role: RECYCLER
                      fullName: Jorge Luis Mendoza Ruiz
                      phone: '944123456'
                      reference: null
                      pickupPoint: null
                      profileComplete: true
                      createdAt: '2026-10-19T16:05:40Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-bian:
        serviceDomain: Party Data Management
        actionTerm: Retrieve
  /party-data-management/{cr-reference-id}/update:
    parameters:
    - $ref: '#/components/parameters/CrReferenceId'
    put:
      tags: [Party Data Management]
      summary: Completar o editar mi perfil
      description: |
        HU-03. Nombre y apellido y celular son obligatorios (se validan también en el backend).
        El vecino puede agregar una referencia opcional de hasta 150 caracteres.
        El correo y el rol no son editables.
        Si cambia el celular, las contrapartes con pedidos activos ven el número nuevo.
      operationId: updatePartyDataManagement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyDataManagementUpdateInputModel'
            examples:
              vecino:
                summary: Vecino completa su perfil con referencia
                value:
                  fullName: Rosa Elena Carranza Vega
                  phone: '987654321'
                  reference: Casa de dos pisos con portón verde, frente al parque
              reciclador:
                summary: Reciclador completa su perfil
                value:
                  fullName: Jorge Luis Mendoza Ruiz
                  phone: '944123456'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyDataManagementOutputModel'
              examples:
                vecino_sin_ubicacion:
                  summary: Perfil guardado; falta marcar la ubicación (profileComplete = false)
                  value:
                    crReferenceId: 7b1c2d3e-4f50-4a61-8b72-93a4b5c6d7e8
                    partyDataManagementInstanceRecord:
                      id: 7b1c2d3e-4f50-4a61-8b72-93a4b5c6d7e8
                      email: rosa.carranza@example.com
                      role: NEIGHBOR
                      fullName: Rosa Elena Carranza Vega
                      phone: '987654321'
                      reference: Casa de dos pisos con portón verde, frente al parque
                      pickupPoint: null
                      profileComplete: false
                      createdAt: '2026-10-20T13:42:10Z'
                reciclador:
                  summary: Reciclador con perfil completo
                  value:
                    crReferenceId: c4d5e6f7-0819-4a2b-9c3d-4e5f60718293
                    partyDataManagementInstanceRecord:
                      id: c4d5e6f7-0819-4a2b-9c3d-4e5f60718293
                      email: jorge.mendoza@example.com
                      role: RECYCLER
                      fullName: Jorge Luis Mendoza Ruiz
                      phone: '944123456'
                      reference: null
                      pickupPoint: null
                      profileComplete: true
                      createdAt: '2026-10-19T16:05:40Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-bian:
        serviceDomain: Party Data Management
        actionTerm: Update

  # ───────────── Party Authentication: sesión (HU-02) ─────────────
  /party-authentication/initiation:
    post:
      tags: [Party Authentication]
      summary: Iniciar sesión
      description: |
        HU-02. Devuelve un JWT que vence a los 30 días. Si los datos son incorrectos, el mensaje no indica cuál falló.
        La app guarda el token en DataStore y lo envía en cada petición. Cerrar sesión solo borra el token en el teléfono.
        Si el backend responde 401 en cualquier endpoint, la app borra el token y vuelve al inicio de sesión.
      operationId: initiatePartyAuthentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyAuthenticationInitiateInputModel'
            examples:
              login:
                summary: Inicio de sesión
                value:
                  email: rosa.carranza@example.com
                  password: Reciclatru2026
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyAuthenticationOutputModel'
              examples:
                vecino:
                  summary: JWT con vigencia de 30 días
                  value:
                    crReferenceId: 7b1c2d3e-4f50-4a61-8b72-93a4b5c6d7e8
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3YjFjMmQzZS00ZjUwLTRhNjEtOGI3Mi05M2E0YjVjNmQ3ZTgiLCJyb2xlIjoiTkVJR0hCT1IiLCJpYXQiOjE3OTMwMjY4MDAsImV4cCI6MTc5NTYxODgwMH0.k3J9xV2mQ7pLw0YtB8nZc1RfD5uHsEaGoKiNj4TbXyU
                    tokenType: Bearer
                    expiresAt: '2026-11-25T15:00:00Z'
                    partyDataManagementInstanceRecord:
                      id: 7b1c2d3e-4f50-4a61-8b72-93a4b5c6d7e8
                      email: rosa.carranza@example.com
                      role: NEIGHBOR
                      fullName: Rosa Elena Carranza Vega
                      phone: '987654321'
                      reference: Casa de dos pisos con portón verde, frente al parque
                      pickupPoint:
                        latitude: -8.077806
                        longitude: -79.122183
                        address: Av. Víctor Larco 1280, Huanchaco
                        district: Huanchaco
                      profileComplete: true
                      createdAt: '2026-10-20T13:42:10Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-bian:
        serviceDomain: Party Authentication
        actionTerm: Initiate

  # ───────────── Location Data Management: ubicación del vecino (HU-04) ─────────────
  /location-data-management/{cr-reference-id}/pickup-point/update:
    parameters:
    - $ref: '#/components/parameters/CrReferenceId'
    put:
      tags: [Location Data Management]
      summary: Registrar mi ubicación de recojo (vecino)
      description: |
        HU-04. Guarda el punto marcado en el mapa (centro del mapa, 6 decimales), la dirección y el distrito.
        No usa GPS. Cada pedido copia esta ubicación al publicarse; si se cambia, solo afecta a los pedidos posteriores (RN18).
        Usa `me` como `cr-reference-id`.
      operationId: updateLocationDataManagementPickupPoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupPointUpdateInputModel'
            examples:
              huanchaco:
                summary: Punto marcado en el mapa (6 decimales)
                value:
                  latitude: -8.077806
                  longitude: -79.122183
                  address: Av. Víctor Larco 1280, Huanchaco
                  district: Huanchaco
      responses:
        '200':
          description: Ubicación guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyDataManagementOutputModel'
              examples:
                vecino_completo:
                  summary: Con la ubicación el perfil queda completo
                  value:
                    crReferenceId: 7b1c2d3e-4f50-4a61-8b72-93a4b5c6d7e8
                    partyDataManagementInstanceRecord:
                      id: 7b1c2d3e-4f50-4a61-8b72-93a4b5c6d7e8
                      email: rosa.carranza@example.com
                      role: NEIGHBOR
                      fullName: Rosa Elena Carranza Vega
                      phone: '987654321'
                      reference: Casa de dos pisos con portón verde, frente al parque
                      pickupPoint:
                        latitude: -8.077806
                        longitude: -79.122183
                        address: Av. Víctor Larco 1280, Huanchaco
                        district: Huanchaco
                      profileComplete: true
                      createdAt: '2026-10-20T13:42:10Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-bian:
        serviceDomain: Location Data Management
        behaviorQualifier: PickupPoint
        actionTerm: Update

  # ───────────── Servicing Order: pedidos ─────────────
  /servicing-order/initiation:
    post:
      tags: [Servicing Order]
      summary: Publicar un pedido (vecino)
      description: |
        HU-05. De 1 a 10 ítems. Requiere perfil completo, incluida la ubicación (RN20).
        El pedido queda `PENDING` con la ubicación del perfil. Las fotos se suben aparte (HU-09).
        Se puede tener varios pedidos a la vez.
      operationId: initiateServicingOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicingOrderInitiateInputModel'
            examples:
              dos_items:
                summary: Pedido con dos ítems
                value:
                  items:
                  - description: Botellas de plástico PET
                    weightKg: 4.5
                  - description: Cartón corrugado
                    weightKg: 8.0
      responses:
        '201':
          description: Pedido creado
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicingOrderOutputModel'
              examples:
                recien_publicado:
                  summary: PENDING sin fotos ni aceptaciones (las fotos se suben aparte)
                  value:
                    crReferenceId: 0f8a3c52-6d1e-4b7a-9e40-2c5d8b1a7f36
                    servicingOrderInstanceRecord:
                      id: 0f8a3c52-6d1e-4b7a-9e40-2c5d8b1a7f36
                      status: PENDING
                      items:
                      - description: Botellas de plástico PET
                        weightKg: 4.5
                      - description: Cartón corrugado
                        weightKg: 8.0
                      totalWeightKg: 12.5
                      photos: []
                      zone: Huanchaco
                      approximateDistanceKm: null
                      acceptanceCount: 0
                      acceptanceStatus: null
                      chosenRecyclerName: null
                      counterpart: null
                      pickup: null
                      availableActions:
                      - EDIT
                      - CANCEL
                      createdAt: '2026-10-26T14:05:00Z'
                      confirmedAt: null
                      collectedAt: null
                      cancelledAt: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-bian:
        serviceDomain: Servicing Order
        actionTerm: Initiate
  /servicing-order/retrieval:
    get:
      tags: [Servicing Order]
      summary: Mis pedidos (vecino)
      description: |
        HU-06. Solo devuelve los pedidos del vecino del token. Resumen liviano, de 20 en 20, del más reciente al más antiguo.
        `tab=ACTIVE` agrupa `PENDING` y `CONFIRMED`; `tab=HISTORY` agrupa `COLLECTED` y `CANCELLED`.
        Si está `PENDING`, incluye `acceptanceCount`; si está `CONFIRMED`, el nombre del reciclador elegido.
      operationId: retrieveServicingOrderList
      parameters:
      - name: tab
        in: query
        schema:
          type: string
          enum: [ACTIVE, HISTORY]
        example: ACTIVE
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicingOrderListOutputModel'
              examples:
                activos:
                  summary: 'Pestaña ACTIVE: pendiente y confirmado'
                  value:
                    items:
                    - id: 0f8a3c52-6d1e-4b7a-9e40-2c5d8b1a7f36
