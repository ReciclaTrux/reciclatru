name: karate
# Pruebas automáticas continuas del API de PRUEBAS (nunca producción):
#  - a mano (Actions → karate → Run workflow)
#  - cada noche
#  - cuando el repositorio del API avisa que desplegó (repository_dispatch, tipo "api-deployed")
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL base del API de pruebas (termina en /api/v1). Vacío = variable API_BASE_URL
        required: false
      suite:
        description: Suite
        type: choice
        options: [regression, smoke, ratelimit]
        default: regression
      storage:
        description: ¿El API de pruebas tiene el bucket de fotos? (false omite @storage)
        type: choice
        options: ['true', 'false']
        default: 'true'
  schedule:
    - cron: '0 8 * * *' # 03:00 hora de Lima
  repository_dispatch:
    types: [api-deployed]

concurrency:
  group: karate
  cancel-in-progress: false

jobs:
  karate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ github.event.inputs.base_url || github.event.client_payload.base_url || vars.API_BASE_URL }}
      SUITE: ${{ github.event.inputs.suite || 'regression' }}
      STORAGE: ${{ github.event.inputs.storage || vars.API_HAS_STORAGE || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validar la URL
        run: |
          if [ -z "$BASE_URL" ]; then echo "::error::Falta la URL: define la variable API_BASE_URL del repositorio o pásala al ejecutar."; exit 1; fi
          echo "API: $BASE_URL"

      - name: Despertar el API (Render gratuito se duerme)
        run: curl --retry 12 --retry-delay 5 --retry-all-errors -fsS "$BASE_URL/health"

      - name: Ejecutar Karate
        run: mvn -B -ntp test -DbaseUrl="$BASE_URL" -Dsuite="$SUITE" -Dstorage="$STORAGE" -Dkarate.env=ci

      - name: Subir el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reportes-${{ github.run_number }}
          path: |
            target/karate-reports/
            target/surefire-reports/
