name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: reciclatru_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Las migraciones viven en el repositorio reciclatru-db (Flyway). Se aplican con psql antes de las pruebas de integración.
      - name: Apply migrations
        run: |
          git clone --depth 1 https://github.com/${{ github.repository_owner }}/reciclatru-database.git ../reciclatru-database
          for f in ../reciclatru-database/migrations/V*.sql; do psql "postgres://postgres@localhost:5433/reciclatru_test" -v ON_ERROR_STOP=1 -f "$f"; done
      - run: npm run test:integration
