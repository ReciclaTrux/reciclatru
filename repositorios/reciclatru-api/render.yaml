# Render Blueprint. Crea el servicio web de la API; la base y el bucket viven en Neon.
services:
  - type: web
    name: reciclatru-api
    runtime: node
    region: ohio            # cerca de Neon us-east-2
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_EXPIRES_IN_DAYS
        value: "30"
      - key: S3_REGION
        value: us-east-2
      - key: S3_BUCKET
        value: photos
      - key: S3_FORCE_PATH_STYLE   # Neon: el certificado cubre un solo nivel de subdominio, hay que usar estilo path
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_FORMAT
        value: json
      - key: OTEL_ENABLED       # pasar a true cuando existan OTEL_EXPORTER_OTLP_ENDPOINT y OTEL_EXPORTER_OTLP_HEADERS
        value: "false"
      - key: OTEL_SERVICE_NAME
        value: reciclatru-api
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: OTEL_RESOURCE_ATTRIBUTES
        value: deployment.environment=production
      - key: OTEL_EXPORTER_OTLP_ENDPOINT   # Grafana Cloud: https://otlp-gateway-<region>.grafana.net/otlp
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS    # Authorization=Basic <token>; secreto
        sync: false
      - key: DATABASE_URL        # URL con pooler de Neon
        sync: false
      - key: PHONE_ENCRYPTION_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
