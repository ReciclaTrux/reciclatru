sonar.projectKey=reciclatru-api
sonar.organization=reciclatrux

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.module.ts,**/main.ts,**/*.dto.ts,**/*.entity.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/main.ts,**/*.module.ts,**/*.dto.ts,**/*.entity.ts
