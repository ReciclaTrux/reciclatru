name: Deploy to Neon

# Al integrar a main aplica las migraciones pendientes en Neon.
# Requiere el environment "production" (con aprobación manual recomendada) y estos secrets:
#   NEON_FLYWAY_URL      jdbc:postgresql://<host-directo>/<base>?sslmode=require   (sin "-pooler")
#   NEON_FLYWAY_USER
#   NEON_FLYWAY_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "flyway.conf"
  workflow_dispatch:

concurrency:
  group: neon-deploy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Flyway info (antes)
        run: |
          docker run --rm \
            -v "$PWD/migrations:/flyway/migrations:ro" \
            -v "$PWD/flyway.conf:/flyway/conf/flyway.conf:ro" \
            -e FLYWAY_URL="${{ secrets.NEON_FLYWAY_URL }}" \
            -e FLYWAY_USER="${{ secrets.NEON_FLYWAY_USER }}" \
            -e FLYWAY_PASSWORD="${{ secrets.NEON_FLYWAY_PASSWORD }}" \
            flyway/flyway:11 -configFiles=/flyway/conf/flyway.conf info

      - name: Flyway migrate
        run: |
          docker run --rm \
            -v "$PWD/migrations:/flyway/migrations:ro" \
            -v "$PWD/flyway.conf:/flyway/conf/flyway.conf:ro" \
            -e FLYWAY_URL="${{ secrets.NEON_FLYWAY_URL }}" \
            -e FLYWAY_USER="${{ secrets.NEON_FLYWAY_USER }}" \
            -e FLYWAY_PASSWORD="${{ secrets.NEON_FLYWAY_PASSWORD }}" \
            flyway/flyway:11 -configFiles=/flyway/conf/flyway.conf migrate

      - name: Flyway validate (después)
        run: |
          docker run --rm \
            -v "$PWD/migrations:/flyway/migrations:ro" \
            -v "$PWD/flyway.conf:/flyway/conf/flyway.conf:ro" \
            -e FLYWAY_URL="${{ secrets.NEON_FLYWAY_URL }}" \
            -e FLYWAY_USER="${{ secrets.NEON_FLYWAY_USER }}" \
            -e FLYWAY_PASSWORD="${{ secrets.NEON_FLYWAY_PASSWORD }}" \
            flyway/flyway:11 -configFiles=/flyway/conf/flyway.conf validate
