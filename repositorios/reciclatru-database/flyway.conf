# Flyway: configuración común (sin secretos).
# Las credenciales NO van aquí: se pasan por variables de entorno
#   FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD
# (ver .env.example para local y los secrets de GitHub para Neon).

flyway.locations=filesystem:migrations
flyway.schemas=public
flyway.defaultSchema=public
flyway.table=flyway_schema_history

# Falla si hay migraciones fuera de orden o ya aplicadas con cambios (checksum).
flyway.validateOnMigrate=true
flyway.outOfOrder=false

# Cada migración corre en su propia transacción (valor por defecto en PostgreSQL).
# Las migraciones que agregan valores a un ENUM deben ir solas en su archivo.
flyway.mixed=false

# Una base ya existente NO se adopta por accidente.
flyway.baselineOnMigrate=false
