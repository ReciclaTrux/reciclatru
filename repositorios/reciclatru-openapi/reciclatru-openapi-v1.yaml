          description: Pedido recolectado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicingOrderOutputModel'
              examples:
                recolectado:
                  summary: Pedido COLLECTED (final)
                  value:
                    crReferenceId: 5b2e9d41-8c37-4f06-a1d8-7e3c6b9f0a24
                    servicingOrderInstanceRecord:
                      id: 5b2e9d41-8c37-4f06-a1d8-7e3c6b9f0a24
                      status: COLLECTED
                      items:
                      - description: Botellas de vidrio
                        weightKg: 6.0
                      - description: Periódicos y revistas
                        weightKg: 5.5
                      totalWeightKg: 11.5
                      photos:
                      - id: d6e7f809-1a23-4b34-95d6-f7a8091a2b42
                        url: /api/v1/servicing-order/5b2e9d41-8c37-4f06-a1d8-7e3c6b9f0a24/photo/d6e7f809-1a23-4b34-95d6-f7a8091a2b42/retrieval
                      zone: Huanchaco
                      approximateDistanceKm: null
                      acceptanceCount: 2
                      acceptanceStatus: null
                      chosenRecyclerName: null
                      counterpart: null
                      pickup: null
                      availableActions: []
                      createdAt: '2026-10-23T14:10:00Z'
                      confirmedAt: '2026-10-24T16:30:00Z'
                      collectedAt: '2026-10-26T20:15:00Z'
                      cancelledAt: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El pedido no está `CONFIRMED` (`ORDER_NOT_CONFIRMED`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no_confirmado:
                  summary: El pedido no está CONFIRMED
                  value:
                    type: https://api.reciclatru.example.com/errors/order-not-confirmed
                    title: El pedido no está confirmado
                    status: 409
                    code: ORDER_NOT_CONFIRMED
                    detail: Solo se puede marcar como recolectado un pedido confirmado.
                    instance: /api/v1/servicing-order/0f8a3c52-6d1e-4b7a-9e40-2c5d8b1a7f36/fulfillment/execution
      x-bian:
        serviceDomain: Servicing Order
        behaviorQualifier: Fulfillment
        actionTerm: Execute

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (30 días)
      description: Token devuelto por `/party-authentication/initiation`. El backend valida el token y el rol en cada endpoint (RNF-04).
  parameters:
    CrReferenceId:
      name: cr-reference-id
      in: path
      required: true
      description: Referencia del Control Record (BIAN). En Party Data Management y Location Data Management acepta el alias `me`.
      schema:
        type: string
      examples:
        me:
          summary: Usuario autenticado (solo Party y Location)
          value: me
        pedido:
          summary: Referencia de un pedido
          value: 0f8a3c52-6d1e-4b7a-9e40-2c5d8b1a7f36
    PhotoId:
      name: photo-id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: a3b4c5d6-e7f8-4091-a2b3-c4d5e6f70819
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
        example: 20
    Cursor:
      name: cursor
      in: query
      description: Valor `nextCursor` de la página anterior
      schema:
        type: string
      example: eyJjIjoiMjAyNi0xMC0yM1QxNDoxMDowMFoiLCJpIjoiNWIyZTlkNDEtOGMzNy00ZjA2LWExZDgtN2UzYzZiOWYwYTI0In0
  responses:
    BadRequest:
      description: Datos inválidos (`VALIDATION_ERROR`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validacion:
              summary: Contraseña muy corta
              value:
                type: https://api.reciclatru.example.com/errors/validation-error
                title: Datos inválidos
                status: 400
                code: VALIDATION_ERROR
                detail: Revisa los campos indicados.
                instance: /api/v1/party-data-management/initiation
                errors:
                - field: password
                  message: Debe tener al menos 8 caracteres
            celular:
              summary: Celular con formato inválido
              value:
                type: https://api.reciclatru.example.com/errors/validation-error
                title: Datos inválidos
                status: 400
                code: VALIDATION_ERROR
                detail: Revisa los campos indicados.
                instance: /api/v1/party-data-management/me/update
                errors:
                - field: phone
                  message: Debe tener 9 dígitos y empezar con 9
    Unauthorized:
      description: Token ausente, inválido o vencido, o credenciales incorrectas (`UNAUTHENTICATED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            token:
              summary: 'Token ausente, inválido o vencido: la app borra el token y vuelve al inicio'
              value:
                type: https://api.reciclatru.example.com/errors/unauthenticated
                title: Sesión no válida
                status: 401
                code: UNAUTHENTICATED
                detail: Token ausente, inválido o vencido.
                instance: /api/v1/servicing-order/retrieval
            credenciales:
              summary: Login con datos incorrectos (no indica cuál falló)
              value:
                type: https://api.reciclatru.example.com/errors/unauthenticated
                title: Credenciales incorrectas
                status: 401
                code: UNAUTHENTICATED
                detail: Correo o contraseña incorrectos.
                instance: /api/v1/party-authentication/initiation
    Forbidden:
      description: 'Sin permiso. Códigos: `FORBIDDEN_ROLE`, `NOT_ORDER_OWNER`, `NOT_CHOSEN_RECYCLER`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rol:
              summary: Rol sin permiso
              value:
                type: https://api.reciclatru.example.com/errors/forbidden-role
                title: Acción no permitida para tu rol
                status: 403
                code: FORBIDDEN_ROLE
                detail: Solo un vecino puede publicar pedidos.
                instance: /api/v1/servicing-order/initiation
            no_dueno:
              summary: No es el dueño del pedido
              value:
                type: https://api.reciclatru.example.com/errors/not-order-owner
                title: No eres el dueño del pedido
                status: 403
                code: NOT_ORDER_OWNER
                detail: Solo el vecino que publicó el pedido puede hacer esto.
                instance: /api/v1/servicing-order/0f8a3c52-6d1e-4b7a-9e40-2c5d8b1a7f36/update
            no_elegido:
              summary: No es el reciclador elegido
              value:
                type: https://api.reciclatru.example.com/errors/not-chosen-recycler
                title: No eres el reciclador elegido
                status: 403
                code: NOT_CHOSEN_RECYCLER
                detail: Solo el reciclador elegido puede ver la dirección exacta.
                instance: /api/v1/servicing-order/5b2e9d41-8c37-4f06-a1d8-7e3c6b9f0a24/retrieval
    NotFound:
      description: Recurso inexistente (`NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            no_encontrado:
              summary: El recurso no existe
              value:
                type: https://api.reciclatru.example.com/errors/not-found
                title: No encontrado
                status: 404
                code: NOT_FOUND
                detail: El recurso solicitado no existe.
                instance: /api/v1/servicing-order/0f8a3c52-6d1e-4b7a-9e40-2c5d8b1a7f36/retrieval
    Unprocessable:
      description: Regla de negocio incumplida (`PROFILE_INCOMPLETE`, `INVALID_ITEMS`, `INVALID_WEIGHT`, etc.)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            perfil:
              summary: Perfil incompleto
              value:
                type: https://api.reciclatru.example.com/errors/profile-incomplete
                title: Perfil incompleto
                status: 422
                code: PROFILE_INCOMPLETE
                detail: Completa tu nombre, celular y ubicación antes de publicar un pedido.
                instance: /api/v1/servicing-order/initiation
            items:
              summary: Más de 10 o ningún ítem
              value:
                type: https://api.reciclatru.example.com/errors/invalid-items
                title: Cantidad de ítems inválida
                status: 422
                code: INVALID_ITEMS
                detail: Un pedido debe tener entre 1 y 10 ítems.
                instance: /api/v1/servicing-order/initiation
            peso:
              summary: Peso fuera de rango
              value:
                type: https://api.reciclatru.example.com/errors/invalid-weight
                title: Peso inválido
                status: 422
                code: INVALID_WEIGHT
                detail: El peso de cada ítem debe ser mayor que 0 y como máximo 500 kg.
                instance: /api/v1/servicing-order/initiation
                errors:
                - field: items[1].weightKg
                  message: Debe ser mayor que 0 y como máximo 500
  schemas:
    PartyRole:
      type: string
      enum: [NEIGHBOR, RECYCLER]
    OrderStatus:
      type: string
      description: |
        `PENDING` → `CONFIRMED` → `COLLECTED`. Desde `PENDING` o `CONFIRMED` se puede pasar a `CANCELLED`.
        `COLLECTED` y `CANCELLED` son estados finales.
      enum: [PENDING, CONFIRMED, COLLECTED, CANCELLED]
    AcceptanceStatus:
      type: string
      description: Nace `ACCEPTED` y termina en `CHOSEN` o `DISCARDED`.
      enum: [ACCEPTED, CHOSEN, DISCARDED]
    AcceptanceLabel:
      type: string
      description: Etiqueta que ve el reciclador en «Mis pedidos aceptados». Combina el estado de la aceptación y el del pedido.
      enum:
      - AWAITING_CONFIRMATION
      - CHOSEN
      - NOT_CHOSEN
      - CANCELLED_BY_NEIGHBOR
      - COLLECTED
    PartyDataManagementInitiateInputModel:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          example: rosa.carranza@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: Reciclatru2026
        role:
          $ref: '#/components/schemas/PartyRole'
    PartyDataManagementUpdateInputModel:
      type: object
      minProperties: 1
      properties:
        fullName:
          type: string
          description: Nombre y apellido.
          minLength: 2
          maxLength: 80
          example: Rosa Elena Carranza Vega
        phone:
          type: string
          description: 9 dígitos, empieza con 9.
          pattern: ^9\d{8}$
          example: '987654321'
        reference:
          type: string
          maxLength: 150
          description: Solo vecino. Referencia opcional para ubicar la puerta.
          example: Casa de dos pisos con portón verde, frente al parque
    PickupPointUpdateInputModel:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Redondeada a 6 decimales.
          example: -8.077806
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -79.122183
        address:
          type: string
          nullable: true
          description: Dirección aproximada; el vecino puede corregirla o escribirla a mano. El punto del mapa no cambia.
          example: Av. Víctor Larco 1280, Huanchaco
        district:
          type: string
          nullable: true
          example: Huanchaco
    PartyAuthenticationInitiateInputModel:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: rosa.carranza@example.com
        password:
          type: string
          format: password
          example: Reciclatru2026
    PartyAuthenticationOutputModel:
      type: object
      required: [crReferenceId, accessToken, expiresAt, partyDataManagementInstanceRecord]
      properties:
        crReferenceId:
          type: string
          format: uuid
          example: 0f8a3c52-6d1e-4b7a-9e40-2c5d8b1a7f36
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3YjFjMmQzZS00ZjUwLTRhNjEtOGI3Mi05M2E0YjVjNmQ3ZTgiLCJyb2xlIjoiTkVJR0hCT1IiLCJpYXQiOjE3OTMwMjY4MDAsImV4cCI6MTc5NTYxODgwMH0.k3J9xV2mQ7pLw0YtB8nZc1RfD5uHsEaGoKiNj4TbXyU
        tokenType:
          type: string
          example: Bearer
        expiresAt:
          type: string
          format: date-time
          description: Emisión + 30 días.
          example: '2026-11-25T15:00:00Z'
        partyDataManagementInstanceRecord:
          $ref: '#/components/schemas/PartyDataManagementInstanceRecord'
    PartyDataManagementInstanceRecord:
      type: object
      required: [id, email, role, profileComplete, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        email:
          type: string
          format: email
          description: No editable.
          example: rosa.carranza@example.com
        role:
          $ref: '#/components/schemas/PartyRole'
        fullName:
          type: string
          nullable: true
          example: Rosa Elena Carranza Vega
        phone:
          type: string
          nullable: true
          example: '987654321'
        reference:
          type: string
          nullable: true
          example: Casa de dos pisos con portón verde, frente al parque
        pickupPoint:
          allOf:
          - $ref: '#/components/schemas/PickupPoint'
          nullable: true
        profileComplete:
          type: boolean
          description: Vecino con nombre, celular y ubicación; reciclador con nombre y celular (RN20).
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-10-26T14:05:00Z'
    PartyDataManagementOutputModel:
      type: object
      required: [crReferenceId, partyDataManagementInstanceRecord]
      properties:
        crReferenceId:
          type: string
          format: uuid
          example: 0f8a3c52-6d1e-4b7a-9e40-2c5d8b1a7f36
        partyDataManagementInstanceRecord:
          $ref: '#/components/schemas/PartyDataManagementInstanceRecord'
    PickupPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          example: -8.077806
        longitude:
          type: number
          format: double
          example: -79.122183
        address:
          type: string
          nullable: true
          example: Av. Víctor Larco 1280, Huanchaco
        district:
          type: string
          nullable: true
          example: Huanchaco
    OrderItem:
      type: object
      required: [description, weightKg]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 100
          example: Botellas de plástico
        weightKg:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          maximum: 500
          multipleOf: 0.1
          description: Peso estimado en kg, con un decimal como máximo (RN06).
          example: 2.5
    ServicingOrderInitiateInputModel:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/OrderItem'
    ServicingOrderUpdateInputModel:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderPhoto:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        url:
          type: string
          description: Ruta de `.../photo/{photo-id}/retrieval`.
          example: /api/v1/servicing-order/0f8a3c52-6d1e-4b7a-9e40-2c5d8b1a7f36/photo/a3b4c5d6-e7f8-4091-a2b3-c4d5e6f70819/retrieval
    Counterpart:
      type: object
      description: Contacto de la otra parte. Solo mientras el pedido esté `PENDING` o `CONFIRMED` y exista una aceptación `ACCEPTED` o `CHOSEN`.
      required: [fullName, phone]
      properties:
        fullName:
          type: string
          example: Rosa Elena Carranza Vega
        phone:
          type: string
          example: '987654321'
    PickupDetail:
      type: object
      description: Solo para el reciclador elegido, mientras el pedido esté `CONFIRMED` (RN13).
      required: [latitude, longitude]
      properties:
        address:
          type: string
          nullable: true
          description: Calle y distrito. Si es nulo, la app muestra «Sin dirección escrita».
          example: Av. Víctor Larco 1280, Huanchaco
        reference:
          type: string
          nullable: true
          example: Casa de dos pisos con portón verde, frente al parque
        latitude:
          type: number
          format: double
          example: -8.077806
        longitude:
          type: number
          format: double
          description: Con estas coordenadas la app arma la URI `geo:` de «Cómo llegar».
          example: -79.122183
    ServicingOrderInstanceRecord:
      type: object
      required: [id, status, items, totalWeightKg, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totalWeightKg:
          type: number
          format: double
          example: 13.7
        photos:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/OrderPhoto'
        zone:
          type: string
          nullable: true
          description: Distrito del punto de recojo.
          example: Huanchaco
        approximateDistanceKm:
          type: number
          format: double
          nullable: true
          description: Solo para el reciclador y solo si envió su ubicación. Nunca se guarda.
          example: 3.4
        acceptanceCount:
          type: integer
          description: Cantidad de recicladores que aceptaron.
          example: 2
        alreadyAccepted:
          type: boolean
          description: Solo reciclador.
          example: false
        acceptanceStatus:
          allOf:
          - $ref: '#/components/schemas/AcceptanceStatus'
          nullable: true
          description: Estado de la aceptación del reciclador que consulta.
        chosenRecyclerName:
          type: string
          nullable: true
          description: Solo vecino, con el pedido `CONFIRMED`.
          example: Jorge Luis Mendoza Ruiz
        counterpart:
          allOf:
          - $ref: '#/components/schemas/Counterpart'
          nullable: true
        pickup:
          allOf:
          - $ref: '#/components/schemas/PickupDetail'
          nullable: true
        availableActions:
          type: array
          description: Acciones posibles en ese estado para quien consulta.
          items:
            type: string
            enum: [EDIT, CANCEL, CHOOSE_RECYCLER, MARK_COLLECTED, ACCEPT, GO_PICKUP]
        createdAt:
          type: string
          format: date-time
          example: '2026-10-26T14:05:00Z'
        confirmedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-24T16:30:00Z'
        collectedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-26T20:15:00Z'
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-25T20:00:00Z'
    ServicingOrderOutputModel:
      type: object
      required: [crReferenceId, servicingOrderInstanceRecord]
      properties:
        crReferenceId:
          type: string
          format: uuid
          example: 0f8a3c52-6d1e-4b7a-9e40-2c5d8b1a7f36
        servicingOrderInstanceRecord:
          $ref: '#/components/schemas/ServicingOrderInstanceRecord'
    ServicingOrderSummary:
      type: object
      description: Resumen liviano para listas. Nunca incluye dirección, nombre ni teléfono (salvo el nombre del reciclador elegido para el vecino dueño).
      required: [id, status, itemCount, totalWeightKg, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        status:
          $ref: '#/components/schemas/OrderStatus'
        itemCount:
          type: integer
          example: 3
        totalWeightKg:
          type: number
          format: double
          example: 13.7
        thumbnailUrl:
          type: string
          nullable: true
          description: Miniatura de la primera foto, si tiene.
          example: /api/v1/servicing-order/0f8a3c52-6d1e-4b7a-9e40-2c5d8b1a7f36/photo/a3b4c5d6-e7f8-4091-a2b3-c4d5e6f70819/retrieval
        zone:
          type: string
          nullable: true
          example: Huanchaco
        approximateDistanceKm:
          type: number
          format: double
          nullable: true
          example: 3.4
        acceptanceCount:
          type: integer
          nullable: true
          description: Solo vecino con el pedido `PENDING`.
          example: 2
        chosenRecyclerName:
          type: string
          nullable: true
          example: Jorge Luis Mendoza Ruiz
        alreadyAccepted:
          type: boolean
          nullable: true
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-10-26T14:05:00Z'
    ServicingOrderListOutputModel:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServicingOrderSummary'
        nextCursor:
          type: string
          nullable: true
          example: eyJjIjoiMjAyNi0xMC0yM1QxNDoxMDowMFoiLCJpIjoiNWIyZTlkNDEtOGMzNy00ZjA2LWExZDgtN2UzYzZiOWYwYTI0In0
    ServicingOrderAvailabilityOutputModel:
      type: object
      required: [items, sortedBy]
      properties:
        sortedBy:
          type: string
          enum: [DISTANCE, DATE]
          description: "`DATE` cuando no se envió ubicación (la app muestra «Activa tu ubicación para ver la distancia»)."
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServicingOrderSummary'
        nextCursor:
          type: string
          nullable: true
          example: eyJjIjoiMjAyNi0xMC0yM1QxNDoxMDowMFoiLCJpIjoiNWIyZTlkNDEtOGMzNy00ZjA2LWExZDgtN2UzYzZiOWYwYTI0In0
    MyAcceptanceSummary:
      type: object
      required: [orderId, acceptanceLabel, totalWeightKg, acceptedAt]
      properties:
        orderId:
          type: string
          format: uuid
          example: 0f8a3c52-6d1e-4b7a-9e40-2c5d8b1a7f36
        acceptanceLabel:
          $ref: '#/components/schemas/AcceptanceLabel'
        zone:
          type: string
          nullable: true
          example: Huanchaco
        totalWeightKg:
          type: number
          format: double
          example: 13.7
        acceptedAt:
          type: string
          format: date-time
          example: '2026-10-26T15:10:00Z'
    MyAcceptanceListOutputModel:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyAcceptanceSummary'
        nextCursor:
          type: string
          nullable: true
          example: eyJjIjoiMjAyNi0xMC0yM1QxNDoxMDowMFoiLCJpIjoiNWIyZTlkNDEtOGMzNy00ZjA2LWExZDgtN2UzYzZiOWYwYTI0In0
    AcceptanceRecord:
      type: object
      required: [id, status, fullName, phone, acceptedAt]
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        status:
          $ref: '#/components/schemas/AcceptanceStatus'
        fullName:
          type: string
          example: Rosa Elena Carranza Vega
        phone:
          type: string
          example: '987654321'
        acceptedAt:
          type: string
          format: date-time
          example: '2026-10-26T15:10:00Z'
    Problem:
      type: object
      description: Error según RFC 7807.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: https://api.reciclatru.example.com/errors/order-not-available
        title:
          type: string
          example: Este pedido ya no está disponible
        status:
          type: integer
          example: 409
        code:
          type: string
          example: ORDER_NOT_AVAILABLE
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
          description: Valor de `x-correlation-id` de la petición; sirve para rastrear el error en los registros.
          example: 4f1c9a62-7d3b-4e58-9b0a-2c6e8d1f5a37
        errors:
          type: array
          description: Detalle por campo en errores de validación.
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
