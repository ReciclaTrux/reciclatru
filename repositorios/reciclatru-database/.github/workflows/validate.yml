name: Validate migrations

# En cada pull request: crea una base vacía, aplica todas las migraciones desde cero
# y verifica que el historial es consistente. Si falla, el PR no se integra.

on:
  pull_request:
    paths:
      - "migrations/**"
      - "flyway.conf"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reciclatru
          POSTGRES_USER: reciclatru
          POSTGRES_PASSWORD: reciclatru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reciclatru -d reciclatru"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Flyway migrate (base vacía)
        run: |
          docker run --rm --network host \
            -v "$PWD/migrations:/flyway/migrations:ro" \
            -v "$PWD/flyway.conf:/flyway/conf/flyway.conf:ro" \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/reciclatru \
            -e FLYWAY_USER=reciclatru \
            -e FLYWAY_PASSWORD=reciclatru \
            flyway/flyway:11 -configFiles=/flyway/conf/flyway.conf migrate

      - name: Flyway validate
        run: |
          docker run --rm --network host \
            -v "$PWD/migrations:/flyway/migrations:ro" \
            -v "$PWD/flyway.conf:/flyway/conf/flyway.conf:ro" \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/reciclatru \
            -e FLYWAY_USER=reciclatru \
            -e FLYWAY_PASSWORD=reciclatru \
            flyway/flyway:11 -configFiles=/flyway/conf/flyway.conf validate

      - name: Información del historial
        run: |
          docker run --rm --network host \
            -v "$PWD/migrations:/flyway/migrations:ro" \
            -v "$PWD/flyway.conf:/flyway/conf/flyway.conf:ro" \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/reciclatru \
            -e FLYWAY_USER=reciclatru \
            -e FLYWAY_PASSWORD=reciclatru \
            flyway/flyway:11 -configFiles=/flyway/conf/flyway.conf info
